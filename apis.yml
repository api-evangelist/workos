aid: workos
name: WorkOS
description: WorkOS is the "Enterprise Ready" identity platform for B2B SaaS — providing
  AuthKit user management, enterprise SSO (SAML/OIDC), Directory Sync (SCIM 2.0),
  Multi-Factor Authentication, Audit Logs, Admin Portal, Fine-Grained Authorization
  (FGA, formerly Warrant), Radar bot/fraud protection, and an emerging suite of agent-oriented
  surfaces (Pipes, MCP Auth, auth.md).
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
