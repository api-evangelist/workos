"""
WorkOS GraphQL Schema (conceptual)

WorkOS exposes a REST-only API (https://api.workos.com). This SDL is a
conceptual data-model schema derived from WorkOS's published REST types,
OpenAPI specification (github.com/workos/openapi-spec), and public
documentation (workos.com/docs/reference). It is intended to aid tooling,
documentation generation, and client code generation — not as a live
GraphQL endpoint.

Types modelled:
  Connection, DirectorySync, User, Group, Profile, Organization,
  OrganizationDomain, Portal, AuditLogEvent, AuditLogExport,
  SSO, SAMLConnection, OIDCConnection, Password, AuthFactor,
  AuthChallenge, Event, Webhook, Environment

Generated: 2026-06-14
Source: https://workos.com/docs/reference / https://github.com/workos/openapi-spec
"""

