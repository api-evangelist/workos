# ---------------------------------------------------------------------------
# Core Identity Types
# ---------------------------------------------------------------------------

"""A WorkOS User (AuthKit managed identity)."""
type User {
  id: ID!
  email: String!
  emailVerified: Boolean!
  firstName: String
  lastName: String
  profilePictureUrl: String
  lastActiveAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  externalId: String
  metadata: JSON
}

"""A member of a Directory (SCIM-synced)."""
type DirectoryUser {
  id: ID!
  directoryId: ID!
  organizationId: ID
  idpId: String!
  rawAttributes: JSON
  firstName: String
  lastName: String
  emails: [DirectoryEmail!]!
  username: String
  state: String!
  groups: [DirectoryGroup!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DirectoryEmail {
  primary: Boolean!
  type: String
  value: String!
}

"""A Directory Group (SCIM-synced group/role)."""
type DirectoryGroup {
  id: ID!
  directoryId: ID!
  organizationId: ID
  idpId: String!
  name: String!
  rawAttributes: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A normalized SSO Profile returned after a successful SSO authentication."""
type Profile {
  id: ID!
  connectionId: ID!
  connectionType: ConnectionType!
  organizationId: ID
  idpId: String!
  email: String!
  emailVerified: Boolean!
  firstName: String
  lastName: String
  profilePictureUrl: String
  groups: [String!]
  rawAttributes: JSON
}

# ---------------------------------------------------------------------------
# Organization
# ---------------------------------------------------------------------------

"""A WorkOS Organization grouping connections, directories, and users."""
type Organization {
  id: ID!
  name: String!
  allowProfilesOutsideOrganization: Boolean!
  domains: [OrganizationDomain!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  externalId: String
  metadata: JSON
}

"""A domain attached to an Organization, subject to DNS or manual verification."""
type OrganizationDomain {
  id: ID!
  organizationId: ID!
  domain: String!
  state: OrganizationDomainState!
  verificationStrategy: OrganizationDomainVerificationStrategy
  verificationToken: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# SSO / Connections
# ---------------------------------------------------------------------------

"""An SSO Connection linking an Organization to an Identity Provider."""
type Connection {
  id: ID!
  organizationId: ID
  name: String!
  connectionType: ConnectionType!
  state: ConnectionState!
  samlConnection: SAMLConnection
  oidcConnection: OIDCConnection
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""SAML-specific attributes for a Connection."""
type SAMLConnection {
  idpEntityId: String
  idpUrl: String
  idpMetadataUrl: String
  idpMetadata: String
  spEntityId: String!
  spAcsUrl: String!
  idpCert: String
}

"""OIDC-specific attributes for a Connection."""
type OIDCConnection {
  clientId: String
  discoveryEndpoint: String
  redirectUri: String!
}

# ---------------------------------------------------------------------------
# Directory Sync
# ---------------------------------------------------------------------------

"""A SCIM Directory Sync connection."""
type DirectorySync {
  id: ID!
  name: String!
  organizationId: ID
  type: DirectoryType!
  state: DirectoryState!
  endpoint: String
  bearerToken: String
  externalKey: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# MFA
# ---------------------------------------------------------------------------

"""An authentication factor (TOTP device) enrolled by a User."""
type AuthFactor {
  id: ID!
  userId: ID
  type: AuthFactorType!
  createdAt: DateTime!
  updatedAt: DateTime!
  totp: TotpFactor
}

type TotpFactor {
  issuer: String
  user: String
  qrCode: String
  secret: String
  uri: String
}

"""A one-time MFA challenge initiated against a factor."""
type AuthChallenge {
  id: ID!
  authFactorId: ID!
  status: AuthChallengeStatus!
  expiresAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Passwords
# ---------------------------------------------------------------------------

"""Password credential metadata for a User (no hash exposed)."""
type Password {
  userId: ID!
  requiresReset: Boolean!
}

# ---------------------------------------------------------------------------
# Admin Portal
# ---------------------------------------------------------------------------

"""A time-limited Admin Portal link for an Organization's IT admin."""
type Portal {
  link: String!
}

# ---------------------------------------------------------------------------
# Audit Logs
# ---------------------------------------------------------------------------

"""A single structured Audit Log event."""
type AuditLogEvent {
  id: ID!
  version: AuditLogEventVersion!
  action: String!
  occurredAt: DateTime!
  actor: AuditLogActor!
  targets: [AuditLogTarget!]!
  context: AuditLogContext!
  metadata: JSON
}

type AuditLogActor {
  id: ID!
  type: String!
  name: String
  metadata: JSON
}

type AuditLogTarget {
  id: ID!
  type: String!
  name: String
  metadata: JSON
}

type AuditLogContext {
  location: String
  userAgent: String
}

"""An in-progress or completed Audit Log CSV export."""
type AuditLogExport {
  id: ID!
  state: AuditLogExportStatus!
  url: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Events & Webhooks
# ---------------------------------------------------------------------------

"""A WorkOS platform event (delivered via Webhooks or polled via Events API)."""
type Event {
  id: ID!
  event: EventType!
  createdAt: DateTime!
  data: JSON!
}

"""A configured Webhook endpoint."""
type Webhook {
  id: ID!
  url: String!
  secret: String
  events: [EventType!]!
  organizationId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------

"""A WorkOS Environment (test / production / staging)."""
type Environment {
  id: ID!
  name: String!
  type: String!
  sandboxMode: Boolean!
  clientId: String!
  redirectUris: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

