# ---------------------------------------------------------------------------
# Root Query
# ---------------------------------------------------------------------------

type Query {
  # Users
  user(id: ID!): User
  users(
    limit: Int
    before: String
    after: String
    email: String
    organizationId: ID
  ): UserConnection!

  # Organizations
  organization(id: ID!): Organization
  organizations(
    limit: Int
    before: String
    after: String
    domains: [String!]
  ): OrganizationConnection!

  # SSO Connections
  connection(id: ID!): Connection
  connections(
    limit: Int
    before: String
    after: String
    organizationId: ID
    connectionType: ConnectionType
  ): ConnectionList!

  # Directory Sync
  directorySync(id: ID!): DirectorySync
  directorySyncs(
    limit: Int
    before: String
    after: String
    organizationId: ID
  ): DirectorySyncList!

  directoryUser(id: ID!): DirectoryUser
  directoryUsers(
    limit: Int
    before: String
    after: String
    directoryId: ID
    organizationId: ID
  ): DirectoryUserConnection!

  directoryGroup(id: ID!): DirectoryGroup
  directoryGroups(
    limit: Int
    before: String
    after: String
    directoryId: ID
    organizationId: ID
  ): DirectoryGroupConnection!

  # MFA
  authFactor(id: ID!): AuthFactor
  authChallenge(id: ID!): AuthChallenge

  # Audit Logs
  auditLogEvent(id: ID!): AuditLogEvent
  auditLogEvents(
    organizationId: ID!
    limit: Int
    before: String
    after: String
    rangeStart: DateTime
    rangeEnd: DateTime
    actions: [String!]
    actorNames: [String!]
    targets: [String!]
  ): AuditLogEventConnection!

  auditLogExport(id: ID!): AuditLogExport

  # Events
  event(id: ID!): Event
  events(
    limit: Int
    after: String
    rangeStart: DateTime
    rangeEnd: DateTime
    events: [EventType!]
    organizationId: ID
  ): EventConnection!

  # Webhooks
  webhook(id: ID!): Webhook
  webhooks(limit: Int, before: String, after: String): WebhookList!

  # Admin Portal
  portalLink(
    organizationId: ID!
    intent: PortalLink!
    returnUrl: String
    successUrl: String
  ): Portal!
}

# ---------------------------------------------------------------------------
# Root Mutation
# ---------------------------------------------------------------------------

type Mutation {
  # Users
  createUser(
    email: String!
    password: String
    firstName: String
    lastName: String
    emailVerified: Boolean
  ): User!

  updateUser(
    id: ID!
    firstName: String
    lastName: String
    emailVerified: Boolean
    password: String
  ): User!

  deleteUser(id: ID!): Boolean!

  # Organizations
  createOrganization(
    name: String!
    allowProfilesOutsideOrganization: Boolean
    domainData: [DomainDataInput!]
    externalId: String
    metadata: JSON
  ): Organization!

  updateOrganization(
    id: ID!
    name: String
    allowProfilesOutsideOrganization: Boolean
    domainData: [DomainDataInput!]
    externalId: String
    metadata: JSON
  ): Organization!

  deleteOrganization(id: ID!): Boolean!

  # SSO Connections
  deleteConnection(id: ID!): Boolean!

  # Directory Sync
  deleteDirectorySync(id: ID!): Boolean!

  # MFA
  enrollAuthFactor(
    userId: ID!
    type: AuthFactorType!
    totpIssuer: String
    totpUser: String
  ): AuthFactor!

  unenrollAuthFactor(id: ID!): Boolean!

  challengeAuthFactor(authFactorId: ID!): AuthChallenge!

  verifyAuthChallenge(authChallengeId: ID!, code: String!): AuthChallengeVerifyResult!

  # Passwords
  resetPassword(token: String!, newPassword: String!): User!
  sendPasswordResetEmail(email: String!, passwordResetUrl: String!): Boolean!
  updatePasswordWithToken(token: String!, newPassword: String!): User!

  # Audit Logs
  createAuditLogEvent(
    organizationId: ID!
    event: AuditLogEventInput!
    idempotencyKey: String
  ): Boolean!

  createAuditLogExport(
    organizationId: ID!
    rangeStart: DateTime!
    rangeEnd: DateTime!
    actions: [String!]
    actorNames: [String!]
    targets: [String!]
  ): AuditLogExport!

  # Webhooks
  createWebhook(
    url: String!
    events: [EventType!]!
    secret: String
  ): Webhook!

  updateWebhook(
    id: ID!
    url: String
    events: [EventType!]
    secret: String
  ): Webhook!

  deleteWebhook(id: ID!): Boolean!
}

